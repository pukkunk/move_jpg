[project]
name = "move-jpg"
version = "0.1.10"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pukkunk", email = "pukkunk@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ffmpeg-python>=0.2.0",
    "ini-cfg-parser>=0.1.11",
    "numpy>=2.4.6",
    "piexif>=1.1.3",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[project.scripts]
move_jpg = "move_jpg:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
py-modules = ["move_jpg"]
